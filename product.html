      <h1>Final Product: </h1>
      <h2>What Will She Imagine? Writted by Anya Schenck, Illustrated by Calhoun's 2025-2026 Third Graders</h2>
      <p class="book-instructions">Please press arrows or use LEFT/RIGHT keys to read.</p>

      <div class ="slider-wrapper">
        <!--LEFT arrow button--->
        <button class ="slider-btn prev-btn" id="prevBtn" aria-label="Previous Page">&#10094;</button>

        <!--book pages-->
        <div class="book-slider">
          <img src="JW Picture Book Pages/1.png" alt="Page 1 Text: What Will She Imagine? / By Anya Schenck / Illustrated by Calhoun's 2025-2026 Third Graders" class="book-page active">
          <img src="JW Picture Book Pages/2.png" alt="Page 2 Text: N/A (plain graph paper style background)" class="book-page">
          <img src="JW Picture Book Pages/3.png" alt="Page 3 Text: This is the story of three middle school girls
            who used curiosity, courage, and imagination
            to build a robot that changed the world." class="book-page">
          <img src="JW Picture Book Pages/4.png" alt="Page 4 Text: Ada, Evelyn, and Grace loved creating. 
            Whether painting, building small gadgets,
            or writing scripts for short films, 
            they could always be found together after school- 
            laughing, experimenting, building, 
            and making something new." class="book-page">
          <img src="JW Picture Book Pages/5.png" alt="Page 5 Text: Most recently, they'd started exploring computer science.
            They learned using spare parts from school and 
            an old coding book from the library." class="book-page">
          <img src="JW Picture Book Pages/6.png" alt="Page 6 Text: They loved watching their ideas finally come to life: 
            a light flickering on,
            a motor beginning to spin, 
            or a screen glowing with code they had written themselves. " class="book-page">
          <img src="JW Picture Book Pages/7.png" alt="Page 7 Text: After a few weeks, though, the instruction 
            book no longer felt exciting." class="book-page">
          <img src="JW Picture Book Pages/8.png" alt="Page 8 Text: “I love what we've made,
            but what could we try next?” said Grace." class="book-page">
          <img src="JW Picture Book Pages/9.png" alt="Page 9 Text: After school that afternoon, they looked out the window. 
            The park across the street had lost three trees during the last storm.
            Ada frowned. “It looks different. It's so… bare,” she sighed." class="book-page">
          <img src="JW Picture Book Pages/10.png" alt="Page 10 Text: Evelyn stared at the empty space.
            “It makes me think about the forests we read about,” said Evelyn.
            “And how fast they're disappearing.”" class="book-page">
          <img src="JW Picture Book Pages/11.png" alt="Page 11 Text: “I wish we could do something,” said Ada." class="book-page">
          <img src="JW Picture Book Pages/12.png" alt="Page 12 Text: What if,” Grace said slowly,
            “we used everything we've learned… to build something that could help—
            not just here, but anywhere it's needed?”" class="book-page">
          <img src="JW Picture Book Pages/13.png" alt="Page 13 Text: The girls looked at each other.
            And then… they smiled." class="book-page">
          <img src="JW Picture Book Pages/14.png" alt="Page 14 Text: They cleared a table, grabbed their 
            markers, and got to work." class="book-page">
          <img src="JW Picture Book Pages/15.png" alt="Page 15 Text: Their ideas kept coming: “A robot!” “To restore forests!” 
          “A robot that plants trees!” “With a rain cloud to water them!”
          “And a little sun to help them grow!” " class="book-page">
          <img src="JW Picture Book Pages/16.png" alt="Page 16 Text: And then, they added more of themselves." class="book-page">
          <img src="JW Picture Book Pages/17.png" alt="Page 17 Text: “Wait… what if we brought music into it too?”
            “Yeah, I love that idea!” “Each tree could play a note when it's planted…”
            “...And once the whole forest is replanted, it could become a whole symphony!”" class="book-page">
          <img src="JW Picture Book Pages/18.png" alt="Page 18 Text: They weren't sure how to build every step from the start.
          But they were curious enough to try." class="book-page">
          <img src="JW Picture Book Pages/19.png" alt="Page 19 Text: And brave enough to begin." class="book-page">
          <img src="JW Picture Book Pages/20.png" alt="Page 20 Text: So they started building: 
            one line of code,
            one bolt tightened,
            one idea made real at a time." class="book-page">
          <img src="JW Picture Book Pages/21.png" alt="Page 21 Text: First, the robot's arm spun in crazy circles,
            sending seeds flying around the room like fireworks. 
            “Whoa! Not what we imagined,” laughed Evelyn." class="book-page">
          <img src="JW Picture Book Pages/22.png" alt="Page 22 Text: Red lights blinked. Motors malfunctioned." class="book-page">
          <img src="JW Picture Book Pages/23.png" alt="Page 23 Text: Bolts wobbled." class="book-page">
          <img src="JW Picture Book Pages/24.png" alt="Page 24 Text: Wires tangled into a mess." class="book-page">
          <img src="JW Picture Book Pages/25.png" alt="Page 25 Text: But the girls didn't stop building. Each mistake was a puzzle.
            Each glitch was a challenge waiting to be solved." class="book-page">
          <img src="JW Picture Book Pages/26.png" alt="Page 26 Text: Step by step, side by side, they made it work.
            Twist, click, tap. 
            The arm spun smoothly now. The rain cloud sprinkled. The sun shone just right." class="book-page">
          <img src="JW Picture Book Pages/27.png" alt="Page 27 Text: Finally, it was time for their robot 
            to show what she could do. They brought her to the bare forest they had read about." class="book-page">
          <img src="JW Picture Book Pages/28.png" alt="Page 28 Text: She planted seed after seed, and the trees began to rise." class="book-page">
          <img src="JW Picture Book Pages/29.png" alt="Page 29 Text: And then… A single music note rang out. Another joined it. Then another." class="book-page">
          <img src="JW Picture Book Pages/30.png" alt="Page 30 Text: The forest came alive. Music echoed through the trees, and new growth 
            reached toward the sky. And their robot had made it happen." class="book-page">
          <img src="JW Picture Book Pages/31.png" alt="Page 31 Text: The girls stepped back and watched their robot work." class="book-page">
          <img src="JW Picture Book Pages/32.png" alt="Page 32 Text: It wasn't perfect. It wasn't easy. But they had built it.
            That mattered, and they were proud." class="book-page">
          <img src="JW Picture Book Pages/33.png" alt="Page 33 Text: Step by step, side by side…
            Through curiosity, courage, and building, they found their power." class="book-page">
          <img src="JW Picture Book Pages/34.png" alt="Page 34 Text: And now, that power is yours.
            What will you imagine? What will you build next?" class="book-page">
          <img src="JW Picture Book Pages/35.png" alt="Page 35 Text: Notes and Appreciations..." class="book-page">
          <img src="JW Picture Book Pages/36.png" alt="Page 36 Text: N/A (collection of many children's drawings)" class="book-page">
          </div>
